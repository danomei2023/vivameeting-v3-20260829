_assets/bit/2024_SEB_5.jpg", "case_assets/bit/2024_SEB_6.jpg", "case_assets/bit/2024_SEB_1.jpg", "case_assets/bit/2024_SEB_2.jpg", "case_assets/bit/2024_SEB_3.jpg", "case_assets/bit/2024_SEB_4.jpg"], "logo": "case_assets/bit_logos/logo_SEB.png", "note": "酶系列真实会议"}, "AIEnzyme-2025": {"zh": "翔珑首届 AI 驱动酶创新论坛", "en": "", "city": "上海奉贤", "year": "2025", "edition": "", "country": "中国", "photos": ["case_assets/bit/2025_AIEnzyme_微信图片_20250428142151.jpg"], "logo": null, "note": "2025.9"}};function getParam(name){return new URLSearchParams(location.search).get(name);}
function render(){
  const hash = location.hash.replace('#','');
  // 支持 case-gala 传 #brand-year
  let key = hash || getParam('c');
  let m = MEETINGS[key];
  if(!m){
    // fallback: 从所有 key 里找
    for(const k in MEETINGS){ if(k===hash) {m=MEETINGS[k]; break;} }
    // 按纯 brand 匹配
    if(!m && hash){ for(const k in MEETINGS){ if(k.startsWith(hash)){m=MEETINGS[k];key=k;break;} } }
  }
  if(!m){
    document.getElementById('galMeta-title').textContent='未找到该会议';
    document.getElementById('galWall').innerHTML='<div class="w empty" style="grid-column:1/-1"></div>';
    return;
  }
  // 标题
  document.getElementById('galMeta-title').innerHTML = m.zh + ' <span class="gold">· 高清照片墙</span>';
  document.getElementById('galMeta-en').textContent = m.en || '';
  if(m.logo){const l=document.getElementById('galMeta-logo');l.src=m.logo;l.style.display='block';}
  // tags
  const tags=[];
  if(m.year)tags.push(m.year);
  if(m.edition)tags.push(m.edition);
  if(m.city)tags.push(m.city);
  if(m.country)tags.push(m.country);
  document.getElementById('galMeta-tags').innerHTML = tags.map(t=>`<span class="gal-tag">${t}</span>`).join('');
  // 照片墙 6格
  const wall=document.getElementById('galWall');
  const photos=m.photos||[];
  document.getElementById('galCount').textContent = photos.length ? `共 ${photos.length} 张现场高清照片` : '该会议暂无高清照片档案';
  let html='';
  for(let i=0;i<6;i++){
    if(i<photos.length){
      html+=`<div class="w"><img src="${photos[i]}" alt="${m.zh} 现场照片 ${i+1}" loading="lazy"><div class="cap">${m.zh} · 现场照片 ${i+1}</div></div>`;
    } else {
      html+=`<div class="w empty"></div>`;
    }
  }
  wall.innerHTML=html;
}
window.addEventListener('load',render);
window.addEventListener('hashchange',render);
</script>
